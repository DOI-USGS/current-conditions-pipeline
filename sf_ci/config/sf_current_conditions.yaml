s3_url_prefix: "https://labs.waterdata.usgs.gov/visualizations/current_conditions/streamflow/"
coverage_file: "data/sf_coverage.parquet"
image_prefix: "images/sf-"
video_prefix: "videos/sf-"
parquet_prefix: "data/sf_categorizations_"
video_intervals:
 - 5d

layouts:
  conus:
    figure_dimensions: [4,4]
    geojson:
      - "data/conus.geojson"
    metadata_column: "mobile_CONUS_image_file"
    prefix: "mobile-CONUS-"
    video: False
    ax_loc:  
      - [0.05,0.05,0.9,0.9]
    multi:  
      - 1.0
    proj:  
      - "EPSG:5070"
  ak:
    figure_dimensions: [4,4]
    geojson:
      - "data/ak.geojson"
    metadata_column: "mobile_AK_image_file"
    prefix: "mobile-AK-"
    video: False
    ax_loc:  
      - [0.05,0.05,0.9,0.9]
    multi:  
      - 1.0
    proj:  
      - "EPSG:3338"
  hi:
    figure_dimensions: [4,4]
    geojson:
      - "data/hi.geojson"
    metadata_column: "mobile_HI_image_file"
    prefix: "mobile-HI-"
    video: False
    ax_loc:  
      - [0.05,0.05,0.9,0.9]
    multi:  
      - 1.0
    proj:  
      - "EPSG:2784"
  prvi:
    figure_dimensions: [4,4]
    geojson:
      - "data/prvi.geojson"
    metadata_column: "mobile_PR_VI_image_file"
    prefix: "mobile-PR_VI-"
    video: False
    ax_loc:  
      - [0.05,0.05,0.9,0.9]
    multi:  
      - 1.0
    proj:  
      - "EPSG:2866"
  gump:
    figure_dimensions: [4,4]
    geojson:
      - "data/gump.geojson"
    metadata_column: "mobile_GU_MP_image_file"
    prefix: "mobile-GU_MP-"
    video: False
    ax_loc:
      - [0.05,0.05,0.9,0.9]
    multi: 
      - 1.0
    proj: 
      - "EPSG:8692"
  as:
    figure_dimensions: [6,6]
    geojson:
      - "data/as.geojson"
    metadata_column: "mobile_AS_image_file"
    prefix: "mobile-AS-"
    video: False
    ax_loc:  
      - [0.05,0.05,0.9,0.9]
    multi:  
      - 1.0
    proj:  
      - "EPSG:6636"
  desktop:
    figure_dimensions: [8,4]
    geojson:
      - "data/conus.geojson"
      - "data/ak.geojson"
      - "data/hi.geojson"
      - "data/prvi.geojson"
      - "data/gump.geojson"
      - "data/as.geojson"
    metadata_column: "desktop_CONUS_image_file"
    prefix: "desktop-CONUS_OCONUS-"
    video: True
    ax_loc: 
      - [0.31, 0.01, 0.68, 0.98]
      - [0.01, 0.64, 0.28, 0.35]
      - [0.11, 0.35, 0.18, 0.28]
      - [0.11, 0.16, 0.18, 0.15]
      - [0.01, 0.01, 0.10, 0.62]
      - [0.11, 0.01, 0.18, 0.15]
    multi:
      - 1.0
      - 0.5
      - 2.0
      - 2.0
      - 2.0
      - 2.0
    proj:
      - "EPSG:5070"
      - "EPSG:3338"
      - "EPSG:2784"
      - "EPSG:2866"
      - "EPSG:8692"
      - "EPSG:6636"

figure_params:
  prefix: "sf_current_conditions"
  facecolor: "#ffffff"
  fontfamily: "sans-serif"
  font: "Source Sans 3"
  fontweight: "normal"
  fontcolor: "#363636"
  fontsize: 7
  scale_params:
    linewidth: 0.5
    color: "#363636"
    scale_length: 0.025
  datelabel:
    fontsize: 10.5
    xloc: 0.99
    yloc: 0.01
  shadow:
    sigma: 25
    color: "#999999"

movie_params:
  framerate: 8

date_range:
  start: "2025-01-01"
  end: "2025-12-31"

census_data:
  resolution: "5m"
  year: 2024

geometries:
  conus:
    geojson: "data/conus.geojson"
    desktop: 5
    mobile: 5
  ak:
    geojson: "data/ak.geojson"
    desktop: 10
    mobile: 10
  hi:
    geojson: "data/hi.geojson"
    desktop: 0
    mobile: 0
  prvi:
    geojson: "data/prvi.geojson"
    desktop: 0
    mobile: 0
  gump:
    geojson: "data/gump.geojson"
    desktop: 0
    mobile: 0
  as:
    geojson: "data/as.geojson"
    desktop: 0
    mobile: 0

state_params:
  style:
    linewidth: 0.5
    edgecolor: "#949494"
    facecolor: "#ffffff"
    outerlinewidth: 0.25
    outeredgecolor: "#949494"

marker_params:
  marker: "o"
  zorder:
    - 7  # Extremely below
    - 5  # Much below
    - 3  # Below normal
    - 2  # Normal
    - 4  # Above normal
    - 6  # Much above
    - 8  # Extremely above
  facecolor:
    - "#ffffffbf"  # Extremely below
    - "#ffffffbf"  # Much below
    - "#ffffffbf"  # Below normal
    - "#494949ff"  # Normal
    - "#74acd1ff"  # Above normal
    - "#4575b4ff"  # Much above
    - "#313694ff"  # Extremely above
  edgecolor:
    - "#532f05ff"  # Extremely below
    - "#8a5109ff"  # Much below
    - "#be812bff"  # Below normal
    - "#ffffffff"  # Normal
    - "#ffffffff"  # Above normal
    - "#ffffffff"  # Much above
    - "#ffffffff"  # Extremely above
  markersize:
    - 7  # Extremely below
    - 5  # Much below
    - 3  # Below normal
    - 1  # Normal
    - 4.731  # Above normal - modified to have a radius that is larger by 0.25pt (Area_wet = pi * (R_increase + sqrt(Area_dry / pi)) ^ 2)
    - 7.178  # Much above - modified to have a radius that is larger by 0.25pt
    - 9.541  # Extremely above - modified to have a radius that is larger by 0.25pt
  linewidth:
    - 0.5  # Extremely below
    - 0.5  # Much below
    - 0.5  # Below normal
    - 0.25  # Normal
    - 0.25  # Above normal
    - 0.25  # Much above
    - 0.25  # Extremely above
  label:
    - "Extremely below"
    - "Much below"
    - "Below normal"
    - "Normal"
    - "Above normal"
    - "Much above"
    - "Extremely above"
  NA:
    marker: 'x'
    color: '#808080'
    linewidth: 0.25
    size: 1
    zorder: 1