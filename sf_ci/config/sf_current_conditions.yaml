state_params:
  style:
    linewidth: 0.25
    edgecolor: "#949494"
    facecolor: "#ffffff"
    outerlinewidth: 0.25
    outeredgecolor: "#949494"

marker_params:
  marker: "o"
  zorder:
  - 7    # Extremely below
  - 5    # Much below
  - 3    # Below normal
  - 2    # Normal
  - 4    # Above normal
  - 6    # Much above
  - 8    # Extremely above
  facecolor:
  - "#ffffffbf"    # Extremely below
  - "#ffffffbf"    # Much below
  - "#ffffffbf"    # Below normal
  - "#333333ff"    # Normal
  - "#489dd5ff"    # Above normal
  - "#2362b3ff"    # Much above
  - "#003375ff"    # Extremely above
  edgecolor:
  - "#4d2b00ff"    # Extremely below
  - "#8c5503ff"    # Much below
  - "#c18b2fff"    # Below normal
  - "#ffffffff"    # Normal
  - "#ffffffff"    # Above normal
  - "#ffffffff"    # Much above
  - "#ffffffff"    # Extremely above
  markersize:
  - 7    # Extremely below
  - 5    # Much below
  - 3    # Below normal
  - 1    # Normal
  - 4.731    # Above normal - modified to have a radius that is larger by 0.25pt (Area_wet = pi * (R_increase + sqrt(Area_dry / pi)) ^ 2)
  - 7.178    # Much above - modified to have a radius that is larger by 0.25pt
  - 9.541    # Extremely above - modified to have a radius that is larger by 0.25pt
  linewidth:
  - 0.5    # Extremely below
  - 0.5    # Much below
  - 0.5    # Below normal
  - 0.25    # Normal
  - 0.25    # Above normal
  - 0.25    # Much above
  - 0.25    # Extremely above
  label:
  - "Extremely below"
  - "Much below"
  - "Below normal"
  - "Normal"
  - "Above normal"
  - "Much above"
  - "Extremely above"
  NA:
    marker: 'x'
    color: '#949494'
    linewidth: 0.25
    size: 2
    zorder: 1
  marker_scaling: 2.0
