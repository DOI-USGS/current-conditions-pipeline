[workspace]
authors = ["Jeffrey Kwang <jkwang@usgs.gov>"]
channels = ["conda-forge", "bioconda"]
name = "current_conditions"
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
install-mapshaper = "npm install -g mapshaper"
pipeline = "snakemake -c1 -s Snakefile"

[dependencies]
snakemake = "*"
#dataretrieval = ">=1.1.0,<2"
pandas = ">=2.3.3,<3"
geopandas = ">=1.1.1,<2"
tqdm = ">=4.67.1,<5"
matplotlib = ">=3.10.8,<4"
pynhd = ">=0.19.4,<0.20"
jupyterlab = ">=4.5.0,<5"
ipykernel = ">=7.1.0,<8"
pip = ">=25.3,<26"
nodejs = ">=25.2.1,<25.3"
proj-data = ">=1.24,<2"
ffmpeg = ">=8.0.1,<9"
# R runtime + packages (via conda-forge)
r-base = ">=4.3,<5"
r-dplyr = ">=1.2.0,<2"
r-tidyr = ">=1.3.2,<2"
r-lubridate = "*"
r-purrr = ">=1.2.1,<2"
r-tidytable = ">=0.11.1,<0.12"
r-arrow = ">=23.0.0,<24"
r-ggplot2 = ">=4.0.2,<5"
r-stringr = ">=1.6.0,<2"
r-sf = ">=1.1_0,<2"
#r-sfarrow = "*"
#r-retry = "*"
r-remotes = ">=2.5.0,<3"   # needed for the GitHub install step below

[pypi-dependencies]
# Replaces the -e git+... pip install in the old Dockerfile
dataretrieval = { git = "https://github.com/DOI-USGS/dataretrieval-python.git", rev = "2c8419ca153af1a1071ccf2ce467e1752ab0834e" }
pygris = "*"
