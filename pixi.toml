[workspace]
authors = ["Jeffrey Kwang <jkwang@usgs.gov>"]
channels = ["conda-forge", "bioconda"]
name = "current_conditions"
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
install-mapshaper = "npm install -g mapshaper"
pipeline = "snakemake -c1 -s Snakefile"

[dependencies]
snakemake = "*"
#dataretrieval = ">=1.1.0,<2"
pandas = ">=2.3.3,<3"
geopandas = ">=1.1.2,<2"
tqdm = ">=4.67.1,<5"
matplotlib = ">=3.10.8,<4"
pynhd = ">=0.19.4,<0.20"
jupyterlab = ">=4.5.0,<5"
ipykernel = ">=7.1.0,<8"
pip = ">=25.3,<26"
nodejs = ">=25.2.1,<25.3"
proj-data = ">=1.24,<2"
ffmpeg = ">=8.0.1,<9"
# R runtime + packages (via conda-forge)
r-base = ">=4.3,<5"
r-dplyr = ">=1.2.0,<2"
r-tidyr = ">=1.3.2,<2"
r-lubridate = "*"
r-purrr = ">=1.2.1,<2"
r-tidytable = ">=0.11.1,<0.12"
r-arrow = ">=23.0.0,<24"
r-ggplot2 = ">=4.0.2,<5"
r-stringr = ">=1.6.0,<2"
r-sf = ">=1.1_0,<2"
#r-sfarrow = "*"
#r-retry = "*"
r-remotes = ">=2.5.0,<3"   # needed for the GitHub install step in Dockerfile
awscli = ">=1.44.45,<3"
pyarrow = ">=23.0.0,<24"
fastparquet = ">=2025.12.0,<2026"
numpy = ">=2.4.2,<3"
boto3 = ">=1.42.55,<2"
s3fs = ">=2026.2.0,<2027"
r-tidyverse = ">=2.0.0,<3"
r-janitor = ">=2.2.1,<3"
r-tigris = ">=2.2.1,<3"
r-sysfonts = ">=0.8.9,<0.9"
r-showtext = ">=0.9_7,<0.10"
r-cowplot = ">=1.2.0,<2"
r-magick = ">=2.9.1,<3"
r-ggforce = ">=0.5.0,<0.6"
r-ggfx = ">=1.0.3,<2"
r-glue = ">=1.8.0,<2"
r-zoo = ">=1.8_15,<2"
botocore = ">=1.42.55,<2"
basemap = ">=2.0.0,<3"
r-svglite = ">=2.2.2,<3"

[pypi-dependencies]
# Replaces the -e git+... pip install in the old Dockerfile
dataretrieval = { git = "https://github.com/DOI-USGS/dataretrieval-python.git", rev = "4dc9f6a68eb62cf6eeefa3b6abb75d7566e75fce" }
pygris = "*"
